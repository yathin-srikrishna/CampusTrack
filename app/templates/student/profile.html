{% extends 'base.html' %}{% block title %}My Profile | CampusTrack{% endblock %}{% block content %}<div class="page-heading"><div><span class="eyebrow">MY PROFILE</span><h1>Contact details</h1><p>Official academic identity is managed by your college.</p></div></div><form class="form-card narrow-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name</label><input value="{{ student.full_name }}" disabled><label>Roll number</label><input value="{{ student.roll_no }}" disabled><label>Email</label><input name="email" type="email" value="{{ student.email or '' }}"><label>Phone</label><input name="phone" value="{{ student.phone or '' }}"><button class="button primary full">Save contact details</button></form>{% endblock %}
